[logger]
output_directory = "structured"

# The legacy simulation.csv retains initial/final fields for the native plotter.
# Avoid duplicating those full fields in the structured logger.
enable_field_logging = false
enable_summary_logging = true
enable_probe_logging = false

field_interval = 10
summary_interval = 1
probe_interval = 1

[[logger.summary]]
name = "solid_temperature"
variable = "temperature"
selection = "solid"
log_min = true
log_max = true
log_average = true
log_rms = false
log_standard_deviation = true

[[logger.summary]]
name = "fluid_temperature"
variable = "temperature"
selection = "fluid"
log_min = true
log_max = true
log_average = true
log_rms = false
log_standard_deviation = true

[[logger.summary]]
name = "fluid_velocity"
variable = "velocity_magnitude"
selection = "fluid"
log_min = true
log_max = true
log_average = true
log_rms = true
log_standard_deviation = true
