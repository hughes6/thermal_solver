name = "Validation fan rack"

[simulation]
dt = 0.1
duration = 20000.0
max_timesteps = 10000000
max_updates = 100000000
max_cell_count = 10000000
max_megabyte_usage = 100


[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 0.0
T_ambient = 20.0
cp = 1005.0
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

[mesh]
adaptive = false
dx = 0.1
dy = 0.1
dz = 0.025

[openfoam_solver]
enabled = true
# For rapid tuning, switch to screening_foam_cfg.toml and use a separate
# The TOML filename is appended to this root, keeping each model isolated.
# A profile's top-level [mesh] overrides the root [mesh] for OpenFOAM export
# only. The root mesh still controls the native explicit solver.
template = "library/openfoam_cfg/validation_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_sim_v2"

[rack]
name = "Validation rack"

[rack.size]
units = "m"
width = 0.5
depth = 1.0
height = 0.3

[[components]]
name = "Aluminum validation block"
watts = 50.0

[components.size]
units = "m"
width = 0.2
depth = 0.2
height = 0.05

[components.position]
units = "m"
x = 0.15
y = 0.2
z = 0.0

[components.material]
rho = 2700.0
cp = 900.0
k = 205.0


#----------------fan------------
[[fans]]
name = "Validation inlet"
shape = "rectangular"
cfm = 15.89
flow_type = "intake"

[fans.position]
units = "m"
x = 0.25
y = 0.0
z = 0.15

[fans.size]
units = "m"
width = 0.50
depth = 0.0
height = 0.30

[fans.direction]
x = 0.0
y = 1.0
z = 0.0

#----------------vent------------
[[vents]]
name = "Validation outlet"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.25
y = 1.0
z = 0.15

[vents.size]
units = "m"
width = 0.50
depth = 0.0
height = 0.30

[vents.normal]
x = 0.0
y = 1.0
z = 0.0
