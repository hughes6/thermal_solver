name = "model 1"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------

[simulation]
dt = 0.01
duration = 10
output_interval = 100
max_timesteps = 1000000
max_updates = 10000000
max_cell_count = 10000000
max_megabyte_usage = 10
update_flow_interval = 100

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
enable_flow_solver = true
resistivity = 4.6
tolerance = 1e-7
max_iterations = 3000
sor_omega = 1.1
max_outer_iters = 20
flow_tolerance = 1e-3

# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225 

# -------------------------------------------------------------
# Mesh
# -------------------------------------------------------------

[mesh]
# Set adaptive = true and replace dx/dy/dz with fine_dx, coarse_dx, and
# refinement_margin to refine around components, fans, and vents.
adaptive = true
fine_dx = 0.05
coarse_dx = 0.2
refinement_margin = 0.01

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/logger1.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack] 
name = "default single bay, double depth rack"

[rack.size]
units = "u"
width = 12.1
depth = 24.6
height = 41.75

[rack.ambient]
temperature = 20.15
pressure = 101325
density = 1.204
cp = 1005
k = 0.02587
rho = 1.204

# -------------------------------------------------------------
# Components
# -------------------------------------------------------------
[[components]]
template = "library/components/eaton_2U_UPS.toml"

[components.position]
units = "u"
x = 1.1
y = 0
z = 0

[[components]]
template = "library/components/DELL_R470.toml"

[components.position]
units = "u"
x = 0.628
y = 0
z = 4

[[components]]
template = "library/components/trenton_3u_bam.toml"

[components.position]
units = "u"
x = 0
y = 0
z = 4

