name = "model 1"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------

[simulation]
dt = 0.1
duration = 100
output_interval = 50
max_timesteps = 1000000
max_updates = 10000000
max_cell_count = 10000000
max_megabyte_usage = 10
update_flow_interval = 100

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
enable_flow_solver = true
resistivity = 4.6
tolerance = 1e-7
max_iterations = 3000
sor_omega = 1.1
max_outer_iters = 20
flow_tolerance = 1e-3

# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

# -------------------------------------------------------------
# Mesh
# -------------------------------------------------------------

[mesh]
# Set adaptive = true and replace dx/dy/dz with fine_dx, coarse_dx, and
# refinement_margin to refine around components, fans, and vents.
adaptive = false
dx = 0.1
dy = 0.1
dz = 0.1

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/logger1.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack] 
name = "default single bay rack"

[rack.size]
units = "u"
width = 13.75
depth = 24.0
height = 42.0

[rack.ambient]
temperature = 20.15
pressure = 101325
density = 1.204
cp = 1005
k = 0.02587
rho = 1.204

# -------------------------------------------------------------
# Components
# -------------------------------------------------------------
[[components]]
template = "library/components/keysight_N6701C.toml"

[components.position]
units = "u"
x = 0
y = 0
z = 0

# [[components]]
# template = "library/components/tripplite_b020_u08_19_ip_kvm.toml"

# [components.position]
# units = "u"
# x = 0
# y = 0
# z = 1
# -------------------------------------------------------------
# Fans
# -------------------------------------------------------------

[[fans]]
name = "Top fan"
shape = "circular"
diameter = 0.35
diameter_units = "m"
cfm = 80.0
flow_type = "exhaust"
curve = "delta_afb0812_12v"

[fans.position]
units = "u"
x = 5.0
y = 5.0
z = 42.0

[fans.direction]
x = 0.0
y = 0.0
z = 1.0


# -------------------------------------------------------------
# Vents
# -------------------------------------------------------------
[[vents]]
name = "main front vent"
shape = "rectangular"
free_area_ratio = 0.5
vent_discharge_coeff = 0.5

[vents.position]
units = "u"
x = 6.875
y = 0
z = 6.0

[vents.size]
units = "u"
width = 10
depth = 0
height = 4

[vents.normal]
x = 0.0
y = 1.0
z = 0.0