name = "Porous pressure-drop validation duct"

[simulation]
dt = 0.1
duration = 30.0
max_timesteps = 100000
max_updates = 10000000
max_cell_count = 100000
max_megabyte_usage = 100

[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 0.0
T_ambient = 20.0
cp = 1005.0
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

[mesh]
adaptive = false
dx = 0.1
dy = 0.05
dz = 0.1

[openfoam_solver]
enabled = true
template = "library/openfoam_cfg/validation_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_sim_v2"
airflow_warmup_time = 2.0

[rack]
name = "Porous validation duct"

[rack.size]
units = "m"
width = 0.2
depth = 1.0
height = 0.2

[[porous_regions]]
name = "Known mixed resistance"
darcy_coefficient = 100000.0
forchheimer_coefficient = 5000.0
transverse_darcy_coefficient = 1.0e8
transverse_forchheimer_coefficient = 1.0e5

[porous_regions.position]
units = "m"
x = 0.0
y = 0.45
z = 0.0

[porous_regions.size]
units = "m"
width = 0.2
depth = 0.1
height = 0.2

[porous_regions.direction]
x = 0.0
y = 1.0
z = 0.0

[[fans]]
name = "Uniform duct inlet"
shape = "rectangular"
cfm = 169.51
flow_type = "intake"

[fans.position]
units = "m"
x = 0.1
y = 0.0
z = 0.1

[fans.size]
units = "m"
width = 0.2
depth = 0.0
height = 0.2

[fans.direction]
x = 0.0
y = 1.0
z = 0.0

[[vents]]
name = "Uniform duct outlet"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.1
y = 1.0
z = 0.1

[vents.size]
units = "m"
width = 0.2
depth = 0.0
height = 0.2

[vents.normal]
x = 0.0
y = 1.0
z = 0.0
