# Generic-component comparison model generated from library/models/model_generic_components.toml
# Detailed component model remains unchanged.
# Generic-component comparison model generated from library/models/model.toml
# Detailed component model remains unchanged.
name = "Solar ObsSim"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------
[simulation]
advection_subcycling = true
advection_cfl_target = 0.8
max_advection_substeps = 10000

dt = 0.1
duration = 30
output_interval = 100
max_timesteps = 1000000
max_updates = 30000000
max_cell_count = 10000000
max_megabyte_usage = 500
update_flow_interval = 100

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
enable_flow_solver = true
pressure_method = "pcg"
#pressure_method = "sor"
resistivity = 4.6
tolerance = 1e-6
max_iterations = 3500
sor_omega = 1.1
max_outer_iters = 20
flow_tolerance = 1e-3


# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

# -------------------------------------------------------------
# Fine production mesh
# -------------------------------------------------------------

[mesh]
adaptive = true
fine_dx = 0.02
coarse_dx = 0.050
refinement_margin = 0.02

# -------------------------------------------------------------
# OpenFOAM backend
# -------------------------------------------------------------

[openfoam_solver]
enabled = true
# For rapid tuning, switch to screening_foam_cfg.toml and use a separate
# The model filename is appended to case_root_directory. For example, copying
# this file to alternate_layout.toml exports to .../alternate_layout instead
# of overwriting or reusing this model's results.
# A profile's top-level [mesh] overrides the root [mesh] for OpenFOAM export
# only. The root mesh still controls the native explicit solver.
template = "library/openfoam_cfg/indepth_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_sim_v2"

# -------------------------------------------------------------
# Coarse warm-start stage
# -------------------------------------------------------------

[multistage]
enabled = true
coarse_dt = 0.1
coarse_duration = 30.0
coarse_update_flow_interval = -1

[multistage.coarse_mesh]
fine_dx = 0.05
coarse_dx = 0.20
refinement_margin = 0.02

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/logger1.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack]
name = "default single bay, double depth rack"

[rack.size]
units = "u"
width = 12.1
depth = 24.6
height = 41.75

# -------------------------------------------------------------
# Components
# -------------------------------------------------------------
[[components]]
template = "library/components/generic_eaton_2u_airside.toml"

[components.position]
units = "u"
x = 1.1
y = 1.0
z = 0

[[components]]
template = "library/components/generic_dell_r470_1u_airside.toml"

[components.position]
units = "u"
x = 0.628
y = 1.0
z = 5

[[components]]
template = "library/components/generic_trenton_3u_airside.toml"

[components.position]
units = "u"
x = 0
y = 1.0
z = 8

