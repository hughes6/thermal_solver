name = "Validation rack"

[simulation]
dt = 0.1
duration = 600.0
max_timesteps = 10000000
max_updates = 100000000
max_cell_count = 10000000
max_megabyte_usage = 100


[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 0.0
T_ambient = 20.0
cp = 1005.0
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

[mesh]
adaptive = false
dx = 0.1
dy = 0.1
dz = 0.1

[openfoam_solver]
enabled = true
# For rapid tuning, switch to screening_foam_cfg.toml and use a separate
# case_directory such as C:/OpenFOAM/thermal_sim_v2/production_rack_screening.
# A profile's top-level [mesh] overrides the root [mesh] for OpenFOAM export
# only. The root mesh still controls the native explicit solver.
template = "library/openfoam_cfg/indepth_foam_cfg.toml"
case_directory = "C:/OpenFOAM/thermal_sim_v2/production_rack"

[rack]
name = "Validation rack"

[rack.size]
units = "m"
width = 0.5
depth = 0.5
height = 1.0

[rack.ambient]
temperature = 20.0
cp = 1005.0
k = 0.02587
rho = 1.225

[[components]]
name = "Aluminum validation block"
watts = 1000.0

[components.size]
units = "m"
width = 0.5
depth = 0.5
height = 0.2

[components.position]
units = "m"
x = 0.0
y = 0.0
z = 0.4

[components.material]
rho = 2700.0
cp = 900.0
k = 205.0
