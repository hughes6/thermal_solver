name = "Rack Test"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------

[simulation]
dt = 0.0005
duration = 1.0
output_interval = 50
max_timesteps = 10000000
max_updates = 100000000
max_cell_count = 100000000
max_megabyte_usage = 100
update_flow_interval = 1000

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
pressure_method = "pcg"
enable_flow_solver = true
resistivity = 4.6
tolerance = 1e-7
max_iterations = 3000
sor_omega = 1.1
max_outer_iters = 20
flow_tolerance = 1e-3

# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

# -------------------------------------------------------------
# Mesh
# -------------------------------------------------------------

# [mesh]
# Set adaptive = true and replace dx/dy/dz with fine_dx, coarse_dx, and
# refinement_margin to refine around components, fans, and vents.
# adaptive = false
# dx = 0.05
# dy = 0.05
# dz = 0.05

[mesh]
adaptive = true
fine_dx = 0.02
coarse_dx = 0.050
refinement_margin = 0.01

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/default_logger.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack] 
name = "testing rack"

[rack.size]
units = "u"
width = 5.0
depth = 5.0
height = 5.0

# -------------------------------------------------------------
# Components
# -------------------------------------------------------------

[[components]]
name = "Server 1"
watts = 60

[components.position]
units = "u"
x = 0.0
y = 0.0
z = 2.0

[components.size]
units = "u"
width = 5.0
depth = 5.0
height = 1.0

[components.material]
rho = 2700
cp = 900
k = 150

# ----- region 1 --------

[[components.internal_regions]]
name = "CPU"
watts = 200
state = "solid" 

[components.internal_regions.position] 
# relative to bot left corner parent component
units = "u"
x = 0.0
y = 0.0
z = 0.0

[components.internal_regions.size]
units = "u"
width = 5.0
depth = 5.0
height = 1.0

[components.internal_regions.material]
rho = 2300
cp = 700
k = 120



