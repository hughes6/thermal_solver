# -------------------------------------------------------------
# Fans
# -------------------------------------------------------------

[[fans]]
name = "Top fan"
shape = "circular"
diameter = 0.1
diameter_units = "m"
cfm = 80.0
flow_type = "exhaust"
curve = "delta_afb0812_12v"

[fans.position]
units = "u"
x = 2.5
y = 2.5
z = 5.0

[fans.direction]
x = 0.0
y = 0.0
z = 1.0


# -------------------------------------------------------------
# Vents
# -------------------------------------------------------------

[[vents]]
name = "main front vent"
shape = "rectangular"
free_area_ratio = 0.5
vent_discharge_coeff = 0.5

[vents.position]
units = "u"
x = 2.5
y = 0
z = 4

[vents.size]
units = "u"
width = 2
depth = 0
height = 1

[vents.normal]
x = 0.0
y = 1.0
z = 0.0

