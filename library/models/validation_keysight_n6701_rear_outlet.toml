name = "Keysight N6701 rear outlet validation"

[simulation]
dt = 0.01
duration = 30.0
output_interval = 1
max_timesteps = 100000
max_updates = 100000000
max_cell_count = 3000000
max_megabyte_usage = 1024

[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 0.9833

[mesh]
adaptive = true
fine_dx = 0.01
coarse_dx = 0.04
refinement_margin = 0.015

[openfoam_solver]
enabled = true
template = "library/openfoam_cfg/screening_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_sim_SOLAR_ATB"
parallel_processes = 4
airflow_warmup_time = 0.05
minimum_initial_airflow_duration = 0.02
minimum_initial_air_exchange_fraction = 0.0

[rack]
name = "N6701 isolated airflow enclosure"

[rack.size]
units = "m"
width = 0.60
depth = 0.80
height = 0.16

[[components]]
template = "library/components/keysight_N6701C.toml"

[components.position]
units = "m"
x = 0.0875
y = 0.12
z = 0.057775

# Large passive rack openings keep the enclosure pressure-neutral while the
# two component exhaust fans establish their own operating points.
[[vents]]
name = "rack front opening"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.30
y = 0.0
z = 0.08

[vents.size]
units = "m"
width = 0.50
depth = 0.0
height = 0.12

[vents.normal]
x = 0.0
y = -1.0
z = 0.0

[[vents]]
name = "rack rear opening"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.30
y = 0.80
z = 0.08

[vents.size]
units = "m"
width = 0.50
depth = 0.0
height = 0.12

[vents.normal]
x = 0.0
y = 1.0
z = 0.0
