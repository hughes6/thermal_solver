name = "new model - workspace OpenFOAM export validation"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------
[simulation]
advection_subcycling = true
advection_cfl_target = 0.8
max_advection_substeps = 10000

dt = 0.1
# Must exceed the screening profile's 20 s airflow warmup so an exported case
# reaches the thermal stage. Keep this short for exploratory shake-down runs.
duration = 30
output_interval = 100
max_timesteps = 1000000
max_updates = 30000000
max_cell_count = 10000000
max_megabyte_usage = 1024
update_flow_interval = 100

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
enable_flow_solver = true
pressure_method = "pcg"
#pressure_method = "sor"
resistivity = 4.6
tolerance = 1e-6
max_iterations = 3500
sor_omega = 1.1
max_outer_iters = 20
flow_tolerance = 1e-3


# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
# ISA pressure at 5,500 ft and 20 C gives approximately 0.9833 kg/m^3.
rho = 0.9833

# -------------------------------------------------------------
# Fine production mesh
# -------------------------------------------------------------

[mesh]
adaptive = true
fine_dx = 0.02
coarse_dx = 0.050
refinement_margin = 0.02

# -------------------------------------------------------------
# OpenFOAM backend
# -------------------------------------------------------------

[openfoam_solver]
enabled = true
# For rapid tuning, use the screening profile and a separate case directory.
# The model filename is appended to case_root_directory. For example, copying
# this file to alternate_layout.toml exports to .../alternate_layout instead
# of overwriting or reusing this model's results.
# A profile's top-level [mesh] overrides the root [mesh] for OpenFOAM export
# only. The root mesh still controls the native explicit solver.
template = "library/openfoam_cfg/screening_foam_cfg.toml"
case_root_directory = "."

# -------------------------------------------------------------
# Coarse warm-start stage
# -------------------------------------------------------------

[multistage]
enabled = true
# The audited coarse mesh has a 0.0904 s non-subcycled conduction limit.
coarse_dt = 0.05
# Keep the native warm start within the configured update budget; OpenFOAM
# ignores this native-only stage.
coarse_duration = 5.0
coarse_update_flow_interval = -1

[multistage.coarse_mesh]
fine_dx = 0.05
coarse_dx = 0.20
refinement_margin = 0.02

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/logger1.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack] 
name = "default single bay, double depth rack"

[rack.size]
units = "u"
width = 13.1
depth = 24.6
height = 40.0

