name = "NI minimum-separator sensitivity - PROVISIONAL"

# Isolated bounding fixture for the one directly inferable mirrored NI wall.
# This is not an as-built chassis: the 5 mm lower and 2.2 mm upper bypasses,
# separator gauge/termination, and vent communication remain unknown. Never
# map an existing full-rack checkpoint onto this topology-changing fixture.

[simulation]
dt = 0.01
duration = 30.0
output_interval = 1
max_timesteps = 100000
max_updates = 100000000
max_cell_count = 3000000
max_megabyte_usage = 1024
advection_subcycling = true
advection_cfl_target = 0.8
max_advection_substeps = 10000
update_flow_interval = 100

[flow_solver]
enable_flow_solver = true
pressure_method = "pcg"
resistivity = 4.6
tolerance = 1e-6
max_iterations = 2000
sor_omega = 1.1
max_outer_iters = 100
flow_tolerance = 1e-5

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 0.9833

[mesh]
adaptive = true
# The 5 mm wall cuts are barely retained by the 0.25*fine_dx threshold at
# fine_dx=19 mm. However, this spacing merges both the 2.2 mm upper air/wall gap
# and the separate 2.5 mm top-side-vent-edge/wall-top gap. The controlled ladder
# found 8.8 mm to be the coarsest spacing that retains every NI source cut
# (10 mm still retains the 2.5 mm pair alone). No tested spacing prevents the
# vent tunnel from carving the 240 x 5 x 15 mm wall-1 band. This remains a
# rejected sensitivity.
fine_dx = 0.019
coarse_dx = 0.05
refinement_margin = 0.02

[openfoam_solver]
enabled = true
template = "library/openfoam_cfg/screening_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_sim_ni_separator_sensitivity"
parallel_processes = 4
airflow_warmup_time = 0.05
minimum_initial_airflow_duration = 0.02
minimum_initial_air_exchange_fraction = 0.0

[rack]
name = "NI provisional separator isolated enclosure"

[rack.size]
units = "m"
width = 0.50
depth = 0.50
height = 0.30

[[components]]
template = "library/components/updated_NI_PXIe_Chassis_minimum_separator_sensitivity.toml"

[components.position]
units = "m"
x = 0.07
y = 0.12
z = 0.06

[[vents]]
name = "rack front opening"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.25
y = 0.0
z = 0.15

[vents.size]
units = "m"
width = 0.40
depth = 0.0
height = 0.24

[vents.normal]
x = 0.0
y = -1.0
z = 0.0

[[vents]]
name = "rack rear opening"
shape = "rectangular"
free_area_ratio = 1.0
vent_discharge_coeff = 1.0

[vents.position]
units = "m"
x = 0.25
y = 0.50
z = 0.15

[vents.size]
units = "m"
width = 0.40
depth = 0.0
height = 0.24

[vents.normal]
x = 0.0
y = 1.0
z = 0.0
