# Higher-fidelity OpenFOAM profile for final transient and design validation.

[mesh]
adaptive = true
fine_dx = 0.015
coarse_dx = 0.10
refinement_margin = 0.02

[openfoam_solver]
enabled = true
overwrite = true
# Controlled same-checkpoint testing on the 8 GB workstation found two ranks
# 36.6% faster end-to-end than four with 0.0011% temperature RMS difference.
parallel_processes = 2

maximum_time_step = 1.0
maximum_courant_number = 1.0
field_write_interval = 60.0
saved_time_directories = 3
report_interval = 60.0

use_k_omega_sst = true
inlet_turbulence_intensity = 0.05
turbulence_length_scale = 0.01
turbulent_prandtl_number = 0.85
temperature_dependent_air = true
sutherland_temperature = 110.4
use_fan_curves = true
pimple_outer_correctors = 3
# At the fully converged checkpoint, 3x3 was 20.8% slower than 3x2 while
# changing velocity RMS by 0.00181% and temperature RMS by 0.000004%.
pimple_pressure_correctors = 2
fan_curve_extension_multiplier = 2.0
use_vent_pressure_loss = true

use_multirate_thermal = true
airflow_warmup_time = 5.0
use_fan_startup_ramp = true
fan_startup_ramp_time = 0.05
fan_startup_ramp_steps = 5
initial_airflow_check_interval = 0.01
minimum_initial_airflow_duration = 0.30
# Require one rack air replacement before accepting the initial spatial flow field.
minimum_initial_air_exchange_fraction = 1.0
airflow_maximum_time_step = 0.001

# Matched 48,000.02 -> 50,400.02 s studies on the validated 335,580-cell
# rack found dt=20 s changed T by 0.000114 K RMS (0.00183 K worst cell)
# versus dt=10 s. Its thermal-only phase was 40% faster; coupled airflow
# refreshes remain unchanged and dominate the legacy two-sample wall time.
thermal_only_maximum_time_step = 20.0
# Diagnostic only; fixed implicit-step accuracy is controlled by the timestep.
thermal_only_maximum_courant_number = 1000.0
airflow_refresh_interval = 1200.0
airflow_refresh_duration = 0.01
use_adaptive_airflow_refresh = true
# Final-validation refreshes retain the same Co <= 1 fidelity as normal flow.
# A controlled identical-checkpoint study found a 5.34% velocity-field RMS
# difference when the screening refresh ran near Co 2.35 instead of Co 0.8.
airflow_refresh_maximum_courant_number = 1.0
airflow_refresh_check_interval = 0.01
# Ten strict-Co samples is a bounded failure cap. Internal fan convergence uses
# two-sample means to reject the fan source's timestep-scale period-two mode.
maximum_airflow_refresh_duration = 0.10
maximum_mass_imbalance_fraction = 0.01
maximum_device_flow_change_fraction = 0.01
maximum_velocity_rms_change_fraction = 0.01
# Two individually settled 1,200 s refreshes move the transient RANS field
# about 1.5-1.6% while rack flow, heat rejection, and recirculation stay stable.
# Keep the strict 1% local gate above, but allow that bounded long-lag motion.
maximum_accepted_velocity_rms_change_fraction = 0.02
# Ignore sign noise below 0.1% of rack throughput when testing convergence.
# These passive near-zero flows still remain in the ambient mass balance.
minimum_tracked_boundary_flow_fraction = 0.001

stop_when_thermally_converged = true
minimum_thermal_convergence_time = 3600.0
thermal_convergence_reference_interval = 300.0
maximum_temperature_change = 0.10
maximum_component_average_temperature_change = 0.05
thermal_convergence_required_checkpoints = 2

[openfoam_solver.gravity]
x = 0.0
y = 0.0
z = -9.80665
