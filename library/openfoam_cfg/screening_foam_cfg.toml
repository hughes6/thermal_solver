# Fast, ballpark OpenFOAM profile for tuning heat allocation, fan curves,
# vent resistance, and layout. Use indepth_foam_cfg.toml for final validation.

[mesh]
adaptive = true
fine_dx = 0.02
coarse_dx = 0.20
refinement_margin = 0.005

[openfoam_solver]
enabled = true
case_directory = "openfoam_cases/screening_model"
overwrite = true
parallel_processes = 4

maximum_time_step = 1.0
maximum_courant_number = 5.0
field_write_interval = 300.0
saved_time_directories = 3
report_interval = 300.0

use_k_omega_sst = true
inlet_turbulence_intensity = 0.05
turbulence_length_scale = 0.01
turbulent_prandtl_number = 0.85
temperature_dependent_air = true
sutherland_temperature = 110.4
use_fan_curves = true
fan_curve_extension_multiplier = 2.0
use_vent_pressure_loss = true

use_multirate_thermal = true
airflow_warmup_time = 5.0
use_fan_startup_ramp = true
fan_startup_ramp_time = 0.05
fan_startup_ramp_steps = 5
initial_airflow_check_interval = 0.01
minimum_initial_airflow_duration = 0.02

thermal_only_maximum_time_step = 10.0
thermal_only_maximum_courant_number = 1000.0
airflow_refresh_interval = 2400.0
airflow_refresh_duration = 0.02
use_adaptive_airflow_refresh = true
airflow_refresh_maximum_courant_number = 10.0
airflow_refresh_check_interval = 0.01
maximum_airflow_refresh_duration = 20.0
maximum_mass_imbalance_fraction = 0.01
maximum_device_flow_change_fraction = 0.03

stop_when_thermally_converged = true
minimum_thermal_convergence_time = 2400.0
thermal_convergence_reference_interval = 300.0
maximum_temperature_change = 0.25
maximum_component_average_temperature_change = 0.10
thermal_convergence_required_checkpoints = 2

[openfoam_solver.gravity]
x = 0.0
y = 0.0
z = -9.80665
