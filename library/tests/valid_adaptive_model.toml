name = "Minimal adaptive loader model"

[simulation]
dt = 0.01
duration = 0.01
output_interval = 1
max_timesteps = 10
max_updates = 10000
max_cell_count = 10000
max_megabyte_usage = 10
update_flow_interval = 1

[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 5800.0
T_ambient = 20.0
cp = 1005.0
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

[mesh]
adaptive = true
fine_dx = 0.01
coarse_dx = 0.03
refinement_margin = 0.01

[logger]
template = "library/tests/adaptive_logger.toml"

[rack]
name = "Tiny adaptive rack"

[rack.size]
units = "m"
width = 0.05
depth = 0.05
height = 0.05

[rack.ambient]
temperature = 20.0
cp = 1005.0
k = 0.02587
rho = 1.225
