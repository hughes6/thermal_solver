# Thermal-solver component model
# Coordinate convention:
#   x = width, left to right
#   y = depth, front to rear
#   z = height, bottom to top
# External dimensions are based on manufacturer specifications where noted.
# Internal geometry, heat allocation, vent free area, and fan CFM are engineering estimates
# intended for rack-level thermal simulation and should be calibrated against measurements.


# Dell PowerEdge R760, 2U
# Manufacturer chassis dimensions:
# width 482.0 mm, height 86.8 mm, depth 736.29 mm to PSU handle.
# Air-cooled system supports up to six cooling fans.
name = "Dell PowerEdge R760"
watts = 0.0 # in walls

[size]
units = "mm"
width = 482.0
depth = 736.29
height = 86.8

[material] # aluminum-equivalent enclosure
rho = 2700.0
cp = 900.0
k = 150.0

# ----- region 1: interior air -----
[[internal_regions]]
name = "Interior air"
state = "air"

[internal_regions.position]
units = "mm"
x = 5.0
y = 5.0
z = 5.0

[internal_regions.size]
units = "mm"
width = 472.0
depth = 726.29
height = 76.8

# ----- region 2: front intake -----
[[internal_regions]]
name = "Front intake"
state = "vent"
shape = "rectangular"
