# Thermal-solver component model
# Coordinate convention:
#   x = width, left to right
#   y = depth, front to rear
#   z = height, bottom to top
# External dimensions are based on manufacturer specifications where noted.
# Internal geometry, heat allocation, vent free area, and fan CFM are engineering estimates
# intended for rack-level thermal simulation and should be calibrated against measurements.


# Eaton ups, 3000 VA / 3000 W, 3U rack/tower UPS
# watts below represents estimated thermal loss at a substantial operating load,
# not the 3000 W electrical output rating.
# Load ~ 2000W @ ~94% efficiency = ~150W thermal load

name = "Dell PowerEdge R470 1U"
watts = 300

[size]
units = "mm"
width = 482.0
depth = 817.0
height = 43.0

[material]
rho = 2700.0
cp = 900.0
k = 150.0

