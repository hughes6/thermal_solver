# Thermal-solver component model
# Coordinate convention:
#   x = width, left to right
#   y = depth, front to rear
#   z = height, bottom to top
# External dimensions are based on manufacturer specifications where noted.
# Internal geometry, heat allocation, vent free area, and fan CFM are engineering estimates
# intended for rack-level thermal simulation and should be calibrated against measurements.


# Trenton Systems 3U BAM rackmount computer
# IMPORTANT: exact BAM mechanical drawing was not available in the source material used.
# The 3U rack envelope below is an engineering placeholder and should be replaced
# with the dimensions from the exact BAM drawing/configuration.
name = "Trenton 3U BAM"
watts = 0.0 # in walls

[size]
units = "mm"
width = 482.6
depth = 500.0
height = 133.35

[material]
rho = 2700.0
cp = 900.0
k = 150.0

