schema = "thermal-sim-research-lab-assumptions-v1"
model = "library/models/new_model_updated.toml"
updated_date = "2026-08-26"

# Values in this ledger are intentionally machine-readable so an estimated
# geometry or load cannot silently become an as-built claim.

[[assumption]]
