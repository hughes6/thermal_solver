[[assumption]]
id = "ni_separator_walls"
category = "geometry"
status = "missing"
component_template = "library/components/updated_NI_PXIe_Chassis.toml"
current_behavior = "Interior air and Card Slot air overlap and remain connected."
closure = "Add measured thin rear/side separator walls and prove the intended mesh connectivity."

[[assumption]]
id = "storage_shelf_construction"
category = "geometry"
status = "provisional_conservative"
component = "3U storage Shelf"
current_behavior = "The full 10u x 9.3u x 3u envelope is homogeneous aluminum."
closure = "Replace with measured sheet, hollow, and opening geometry."

[[assumption]]
id = "unmodeled_obstructions"
category = "geometry"
status = "missing"
items = ["MAU box", "DIN rail obstructions"]
closure = "Measure and add both obstructions before as-built airflow validation."

[[assumption]]
id = "heat_load_inventory"
category = "thermal_load"
status = "estimated"
total_watts = 2315.0
closure = "Replace component estimates with measured operating loads and uncertainty bounds."

[[assumption]]
id = "fan_curves"
category = "airflow"
status = "provisional_uncalibrated"
current_behavior = "Manufacturer-fit and placeholder curves are clamped to zero pressure beyond their first positive zero."
closure = "Install updated measured/manufacturer P-Q curves and validate operating points and windmilling resistance."

[[assumption]]
id = "openfoam_material_homogenization"
category = "material"
status = "known_model_reduction"
current_behavior = "Each component is exported as one homogeneous solid material region."
closure = "Preserve distinct measured material regions or quantify the resulting uncertainty."
