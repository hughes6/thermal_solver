name = "FINAL MODEL"

# -------------------------------------------------------------
# Simulation
# -------------------------------------------------------------
[simulation]
advection_subcycling = true
advection_cfl_target = 0.8
max_advection_substeps = 10000

dt = 0.04
duration = 0.04
native_output_directory = "validation/runs/final_model_native_screen_30mm_stable_step_20260829"
native_overwrite = false
output_interval = 1
max_timesteps = 1000000
max_updates = 100000000
max_cell_count = 750000
max_megabyte_usage = 512
update_flow_interval = -1

# -------------------------------------------------------------
# Flow Solver
# -------------------------------------------------------------

[flow_solver]
enable_flow_solver = true
pressure_method = "pcg"
#pressure_method = "sor"
resistivity = 4.6
tolerance = 1e-6
max_iterations = 3500
sor_omega = 1.1
max_outer_iters = 60
flow_tolerance = 1e-3


# -------------------------------------------------------------
# Environment - air properties
# -------------------------------------------------------------

[environment]
humidity = 30.0
elevation = 5500.0
T_ambient = 20.0
cp = 1005.5
k = 0.02587
mu = 1.81e-5
pr = 0.71
# Altitude-corrected density for 5,500 ft and 20 C.
rho = 0.9833
# -------------------------------------------------------------
# Fine production mesh
# -------------------------------------------------------------

[mesh]
adaptive = true
fine_dx = 0.03
coarse_dx = 0.050
refinement_margin = 0.02

# -------------------------------------------------------------
# OpenFOAM backend
# -------------------------------------------------------------

[openfoam_solver]
enabled = true
# Preserve the established research-lab four-rank campaign.
parallel_processes = 4
# For rapid tuning, switch to screening_foam_cfg.toml and use a separate
# The model filename is appended to case_root_directory. For example, copying
# this file to alternate_layout.toml exports to .../alternate_layout instead
# of overwriting or reusing this model's results.
# A profile's top-level [mesh] overrides the root [mesh] for OpenFOAM export
# only. The root mesh still controls the native explicit solver.
template = "library/openfoam_cfg/screening_foam_cfg.toml"
case_root_directory = "C:/OpenFOAM/thermal_model_final"

# Preserve 5 mm internal solids below the anti-sliver threshold.
[openfoam_solver.mesh]
adaptive = true
fine_dx = 0.019
coarse_dx = 0.10
refinement_margin = 0.02

# -------------------------------------------------------------
# Coarse warm-start stage
# -------------------------------------------------------------

[multistage]
enabled = false
coarse_dt = 0.1
coarse_duration = 30.0
coarse_update_flow_interval = -1

[multistage.coarse_mesh]
fine_dx = 0.05
coarse_dx = 0.20
refinement_margin = 0.02

# -------------------------------------------------------------
# Logger
# -------------------------------------------------------------

[logger]
template = "library/loggers/logger1.toml"

# -------------------------------------------------------------
# Rack
# -------------------------------------------------------------

[rack] 
name = "default single bay, double depth rack"

[rack.size]
units = "u"
width = 13.1
depth = 24.6
height = 40.0

