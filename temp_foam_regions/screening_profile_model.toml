name = "TOML OpenFOAM export test"

[simulation]
dt = 0.01
duration = 10.0
output_interval = 1
max_timesteps = 10000
max_updates = 100000
max_cell_count = 10000
max_megabyte_usage = 50
update_flow_interval = 1

[flow_solver]
enable_flow_solver = false

[environment]
humidity = 30.0
elevation = 5800.0
T_ambient = 20.0
cp = 1005.0
k = 0.02587
mu = 1.81e-5
pr = 0.71
rho = 1.225

[mesh]
adaptive = false
dx = 0.05
dy = 0.05
dz = 0.05

[openfoam_solver]
enabled = true
template = "library/openfoam_cfg/screening_foam_cfg.toml"
parallel_processes = 2
field_write_interval = 5.0
report_interval = 1.0
airflow_warmup_time = 2.0
airflow_refresh_interval = 5.0
airflow_refresh_duration = 0.02
maximum_airflow_refresh_duration = 5.0

[rack]
name = "Tiny OpenFOAM rack"

[rack.size]
units = "m"
width = 0.40
depth = 0.40
height = 0.40

[[components]]
name = "heated block"
watts = 0.0

[components.position]
units = "m"
x = 0.15
y = 0.15
z = 0.15

[components.size]
units = "m"
width = 0.10
depth = 0.10
height = 0.10

[components.material]
rho = 2700.0
cp = 900.0
k = 150.0

[[components.internal_regions]]
name = "heater"
state = "solid"
watts = 25.0

[components.internal_regions.position]
units = "m"
x = 0.025
y = 0.025
z = 0.025

[components.internal_regions.size]
units = "m"
width = 0.05
depth = 0.05
height = 0.05

[components.internal_regions.material]
rho = 2700.0
cp = 900.0
k = 150.0
